services:
  ssti-challenge:
    build: .
    container_name: beginner-ssti-ctf
    environment:
      FLAG: CTF{beginner_ssti_success}
      # Set a fixed key so sessions survive container restarts.
      SECRET_KEY: change-me-to-a-long-random-string
      # Default credentials (no registration, no database):
      #   username: player
      #   password: passwd123
      CTF_USERNAME: player
      CTF_PASSWORD: passwd123
    ports:
      - "5000:5000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
